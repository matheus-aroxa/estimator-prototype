version: '3.8'

services:
  pgvector-db:
    image: pgvector/pgvector:pg17
    container_name: estimator-pgvector
    environment:
      POSTGRES_DB: estimator_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estimator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
    driver: local
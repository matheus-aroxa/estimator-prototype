services:
  backend:
    build:
      context: ./estimator-prototype
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GEMINI_KEY=${GEMINI_KEY}
      - ELASTICSEARCH_URI=${ELASTICSEARCH_URI:-http://elasticsearch:9200}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
    depends_on:
      elasticsearch:
        condition: service_healthy
  frontend:
    build:
      context: ./estimator-chat-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    environment:
      - ELASTIC_PASSWORD=changeme
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
        test: ["CMD-SHELL", "curl -s -u elastic:YourSecurePassword http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
        interval: 10s
        timeout: 10s
        retries: 5

  #inserts mocked data into Elasticsearch
  elasticsearch-populator:
    image: curlimages/curl:7.85.0
    volumes:
      - type: bind
        source: ./scripts/init-es.sh
        target: /usr/share/init-es.sh
    command: sh -c "sh /usr/share/init-es.sh elasticsearch"
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.8
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  esdata:
    driver: local
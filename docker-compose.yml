services:
  backend:
    build:
      context: ./estimator-prototype
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - elasticsearch
  frontend:
    build:
      context: ./estimator-chat-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    environment:
      - ELASTIC_PASSWORD=changeme
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  #inserts mocked data into Elasticsearch
  elasticsearch-populator:
    image: curlimages/curl:7.85.0
    volumes:
      - type: bind
        source: ./scripts/init-es.sh
        target: /usr/share/init-es.sh
    command: sh -c "sh /usr/share/init-es.sh elasticsearch"
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.8
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  esdata:
    driver: local
  ollama:
    driver: local